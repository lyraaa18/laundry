<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidak Ada Koneksi - Laundry Pro</title>
    <link rel="icon" type="image/png" href="assets/logo%201.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 50px 40px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
        }
        .icon-wrap {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f0f4ff, #e0e7ff);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 3rem;
        }
        h1 { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 12px; }
        p  { font-size: 0.95rem; color: #64748b; line-height: 1.7; margin-bottom: 30px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(99,102,241,0.35);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(99,102,241,0.45); }
        .note {
            margin-top: 20px;
            font-size: 0.78rem;
            color: #94a3b8;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">📡</div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Aplikasi Laundry Pro membutuhkan koneksi internet untuk memuat data. Pastikan perangkat Anda terhubung ke internet lalu coba lagi.</p>
        <button class="btn" onclick="tryReconnect()">
            <span id="btnIcon">🔄</span>
            <span id="btnText">Coba Lagi</span>
        </button>
        <div class="note pulse" id="statusNote">
            ⚡ Menunggu koneksi...
        </div>
    </div>

    <script>
        function tryReconnect() {
            document.getElementById('btnText').textContent = 'Memeriksa...';
            document.getElementById('btnIcon').textContent = '⏳';
            
            fetch('login.php', { method: 'HEAD', cache: 'no-cache' })
                .then(() => {
                    document.getElementById('statusNote').textContent = '✅ Koneksi pulih! Mengalihkan...';
                    document.getElementById('statusNote').style.color = '#10b981';
                    setTimeout(() => window.location.href = 'index.php', 800);
                })
                .catch(() => {
                    document.getElementById('btnText').textContent = 'Coba Lagi';
                    document.getElementById('btnIcon').textContent = '🔄';
                    document.getElementById('statusNote').textContent = '❌ Masih belum ada koneksi.';
                    document.getElementById('statusNote').style.color = '#ef4444';
                    setTimeout(() => {
                        document.getElementById('statusNote').textContent = '⚡ Menunggu koneksi...';
                        document.getElementById('statusNote').style.color = '';
                    }, 2000);
                });
        }

        // Auto-check every 5 seconds
        setInterval(() => {
            fetch('login.php', { method: 'HEAD', cache: 'no-cache' })
                .then(() => {
                    document.getElementById('statusNote').textContent = '✅ Koneksi pulih! Mengalihkan...';
                    document.getElementById('statusNote').style.color = '#10b981';
                    setTimeout(() => window.location.href = 'index.php', 800);
                })
                .catch(() => {});
        }, 5000);
    </script>
</body>
</html>
